name: Update GitHub Profile Cards

on:
  push:
    paths:
      - "README.md"
      - ".github/workflows/profile-cards.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-cards:
    name: Generate self-hosted profile SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1.17.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: muhammed-radin
          cards: overview,languages,contributions,lifetime
          output-dir: assets
          themes: light,dark
          commit: true
